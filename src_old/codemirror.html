<!DOCTYPE html>
<html>

<head>
    <title>YAML Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/yaml/yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/lint/lint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror-languageserver/1.0.1/codemirror-languageserver.min.js"></script>
</head>

<body>
    <h1>YAML Editor</h1>
    <div id="editor"></div>
    <script>
    var editor = CodeMirror(document.getElementById("editor"), {
        mode: "yaml",
        theme: "monokai",
        lineNumbers: true,
        tabSize: 2,
        indentWithTabs: false,
        autofocus: true,
        lineWrapping: true,
        height: "500px",
        width: "100%",
        lint: true,
        gutters: ["CodeMirror-lint-markers"],
        lintOnChange: true
    });

    // Настройка LSP-сервера
    var lsOptions = {
        mode: "yaml",
        serverOptions: {
            command: "yaml-language-server",
            args: ["--stdio"]
        },
        clientOptions: {
            documentSelector: ["yaml"]
        }
    };

    CodeMirrorServer.start(editor, lsOptions);
    </script>
</body>

</html>
