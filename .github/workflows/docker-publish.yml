name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Версия hurl зафиксирована, чтобы контрактные тесты не ломались от обновления бинаря
  HURL_VERSION: 8.0.1

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить hurl
        run: |
          curl -sSfL -o "$RUNNER_TEMP/hurl.tar.gz" \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          sudo tar -xzf "$RUNNER_TEMP/hurl.tar.gz" -C /usr/local/bin --strip-components=2 \
            "hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu/bin/hurl"
          hurl --version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      # --frozen: зависимости строго из uv.lock, без его обновления
      - name: Установить зависимости
        run: uv sync --frozen

      # make test сам поднимает бекенд на TEST_PORT, прогоняет tests/hurls/*.hurl
      # и останавливает сервер
      - name: Контрактные тесты (hurl)
        run: make test

      - name: Лог тестового сервера при падении
        if: failure()
        run: cat /tmp/json2yaml-test-server.log || true

  build-and-push:
    # Образ собирается и публикуется только если тесты зелёные
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # provenance/attestations
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Имена образов в GHCR должны быть в нижнем регистре
      - name: Compute image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # В pull request'ах образ только собираем, в реестр не отправляем
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Добавьте linux/arm64, если он нужен на сервере:
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Summary
        run: |
          echo "### Образ собран" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
